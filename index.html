<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#000000" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AJAN" />
    <meta name="description" content="Ev ziyareti planlama ve rota önerisi" />
    <meta name="mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="HandheldFriendly" content="true" />
    <title>AJAN</title>
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('hosp-theme')
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          var accent = localStorage.getItem('hosp-accent') || 'teal'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.setAttribute('data-accent', accent)
          var colors = {
            teal: { light: '#0f6568', dark: '#4eb8bb' },
            blue: { light: '#1f6fab', dark: '#6db4e8' },
            green: { light: '#2f7a45', dark: '#6fbf84' },
            coral: { light: '#c45a3a', dark: '#e89076' },
            amber: { light: '#b07a1a', dark: '#e0b45c' },
            slate: { light: '#4a5d6e', dark: '#9bb0c2' },
            rose: { light: '#a84868', dark: '#e09bb4' },
            indigo: { light: '#3d4f8f', dark: '#9aabdf' },
          }
          var pair = colors[accent] || colors.teal
          var color = theme === 'dark' ? pair.dark : pair.light
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', color)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
